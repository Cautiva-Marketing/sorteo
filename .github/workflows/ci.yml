name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Solo valores ficticios: las pruebas usan los emuladores de Firebase (proyecto "demo-sorteo"),
# nunca credenciales ni proyectos reales.
env:
  FIREBASE_PROJECT_ID: demo-sorteo
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Calidad (tipos, lint, formato, pruebas, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # El emulador de Firestore exige JDK 21 o superior.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse (Performance y Accessibility >= 90)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Chromium de Playwright como respaldo si el ejecutor no trae Chrome (el script lo detecta solo).
      - run: npx playwright install --with-deps chromium

      # El script levanta el emulador, construye la app en modo producción y ejecuta Lighthouse.
      - run: npm run perf
